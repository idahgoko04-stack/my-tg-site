<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Соцсети</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #121214 url('bg.png') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            text-align: center;
        }

        /* Меню стало полностью прозрачным, убраны границы и тени */
        .container {
            max-width: 400px;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background-color: transparent;
            border: none;
            box-shadow: none;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            /* Кнопки сделаны чуть более темными и размытыми, чтобы выделяться на прозрачном фоне */
            background-color: rgba(20, 20, 26, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-link:active {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border-color: transparent;
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Блок только с кнопками-ссылками -->
        <div class="links-list">
            <a href="https://t.me" target="_blank" class="btn-link">✈️ Мой Telegram</a>
            <a href="https://discord.com" target="_blank" class="btn-link">💬 Мой Discord</a>
            <a href="https://steamcommunity.com" target="_blank" class="btn-link">🕹️ Мой Steam профиль</a>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
